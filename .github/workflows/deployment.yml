name: Deployment
run-name: ${{ inputs.tag_name }} / ${{ inputs.environment }}

# Builds the Maton CLI from source in maton-ai/cli-internal (private) and
# publishes the GitHub Release here. Running in this public repo lets us use
# free GitHub build-provenance attestations.
#
# Triggering: workflow_dispatch only. Public repo + private source means we
# must never expose the cli-internal checkout token to untrusted PR code.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        type: string
      environment:
        default: production
        type: environment
      platforms:
        default: "linux,macos,windows"
        type: string
      release:
        description: "Whether to create a GitHub Release"
        type: boolean
        default: true

jobs:
  validate-tag-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name format
        run: |
          if [[ ! "${{ inputs.tag_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag name format. Must be in the form v1.2.3"
            exit 1
          fi

  linux:
    needs: validate-tag-name
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: contains(inputs.platforms, 'linux')
    steps:
      - name: Generate cli-internal source token
        id: source_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: maton-ai
          repositories: cli-internal
      - name: Checkout cli-internal source
        uses: actions/checkout@v6
        with:
          repository: maton-ai/cli-internal
          token: ${{ steps.source_token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          # The version is pinned not only for security purposes, but also to avoid breaking
          # our scripts, which rely on the specific file names generated by GoReleaser.
          version: v2.13.1
          install-only: true
      # We temporarily create a tag on HEAD to make the right version embedded
      # in the built binaries, BUT we don't push it to the remote.
      - name: Create temporary tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: git tag "$TAG_NAME"
      - name: Build release binaries
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: script/release --local "$TAG_NAME" --platform linux
      - name: Generate web manual pages
        run: |
          go run ./cmd/gen-docs --website --doc-path dist/manual
          tar -czvf dist/manual.tar.gz -C dist -- manual
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.rpm
            dist/*.deb

  macos:
    needs: validate-tag-name
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    if: contains(inputs.platforms, 'macos')
    steps:
      - name: Generate cli-internal source token
        id: source_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: maton-ai
          repositories: cli-internal
      - name: Checkout cli-internal source
        uses: actions/checkout@v6
        with:
          repository: maton-ai/cli-internal
          token: ${{ steps.source_token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: v2.13.1
          install-only: true
      - name: Create temporary tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: git tag "$TAG_NAME"
      - name: Build release binaries
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: script/release --local "$TAG_NAME" --platform macos
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip

  windows:
    needs: validate-tag-name
    runs-on: windows-2022
    environment: ${{ inputs.environment }}
    if: contains(inputs.platforms, 'windows')
    steps:
      - name: Generate cli-internal source token
        id: source_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: maton-ai
          repositories: cli-internal
      - name: Checkout cli-internal source
        uses: actions/checkout@v6
        with:
          repository: maton-ai/cli-internal
          token: ${{ steps.source_token.outputs.token }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: v2.13.1
          install-only: true
      - name: Create temporary tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: git tag "$TAG_NAME"
      - name: Build release binaries
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: script/release --local "$TAG_NAME" --platform windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.zip

  release:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    environment: ${{ inputs.environment }}
    if: |
      always() && inputs.release &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Checkout this repo (maton-ai/cli)
        uses: actions/checkout@v6
        with:
          path: public-cli
      - name: Generate cross-repo token
        id: cross_repo_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: maton-ai
          repositories: |
            cli-internal
            cli.maton.ai
      - name: Checkout cli-internal source
        uses: actions/checkout@v6
        with:
          repository: maton-ai/cli-internal
          token: ${{ steps.cross_repo_token.outputs.token }}
          path: src
      - name: Checkout documentation site
        uses: actions/checkout@v6
        with:
          repository: maton-ai/cli.maton.ai
          path: site
          fetch-depth: 0
          token: ${{ steps.cross_repo_token.outputs.token }}
      - name: Merge built artifacts
        uses: actions/download-artifact@v8
      - name: Update site man pages
        env:
          GIT_COMMITTER_NAME: maton automation
          GIT_AUTHOR_NAME: maton automation
          GIT_COMMITTER_EMAIL: noreply@maton.ai
          GIT_AUTHOR_EMAIL: noreply@maton.ai
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          git -C site rm 'manual/maton*.md' 2>/dev/null || true
          tar -xzvf linux/manual.tar.gz -C site
          git -C site add 'manual/maton*.md'
          sed -i.bak -E "s/(assign version = )\".+\"/\1\"${TAG_NAME#v}\"/" site/index.html
          rm -f site/index.html.bak
          git -C site add index.html
          git -C site diff --quiet --cached || git -C site commit -m "maton ${TAG_NAME#v}"
      - name: Prepare release assets
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          shopt -s failglob
          rm -rf dist
          mkdir dist
          for d in linux macos windows; do
            [ -d "$d" ] || continue
            mv -v "$d"/maton_* dist/
          done
      - name: Attest release artifacts
        if: inputs.environment == 'production'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/maton_*"
          create-storage-record: false # (default: true)
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' src/CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for [$VERSION]. Add a '## [$VERSION] - YYYY-MM-DD' section before tagging."
            exit 1
          fi
          echo "--- release notes ---"
          cat dist/release-notes.md
      - name: Mirror CHANGELOG.md to public repo
        env:
          DO_PUBLISH: ${{ inputs.environment == 'production' }}
          GIT_COMMITTER_NAME: maton automation
          GIT_AUTHOR_NAME: maton automation
          GIT_COMMITTER_EMAIL: noreply@maton.ai
          GIT_AUTHOR_EMAIL: noreply@maton.ai
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          cp src/CHANGELOG.md public-cli/CHANGELOG.md
          git -C public-cli add CHANGELOG.md
          if git -C public-cli diff --quiet --cached; then
            echo "CHANGELOG.md unchanged, skipping commit"
            exit 0
          fi
          git -C public-cli commit -m "maton ${TAG_NAME#v}"
          if [ "$DO_PUBLISH" = "true" ]; then
            git -C public-cli push
          else
            echo "(staging) would push:"
            git -C public-cli log --oneline @{upstream}..
            git -C public-cli diff --name-status @{upstream}..
          fi
      - name: Create the release
        env:
          DO_PUBLISH: ${{ inputs.environment == 'production' }}
          TAG_NAME: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s failglob
          pushd dist
          shasum -a 256 maton_* > checksums.txt
          mv checksums.txt maton_${TAG_NAME#v}_checksums.txt
          popd
          release_args=(
            "$TAG_NAME"
            --repo "$GITHUB_REPOSITORY"
            --target main
            --title "Maton CLI ${TAG_NAME#v}"
            --notes-file dist/release-notes.md
          )
          if [[ $TAG_NAME == *-* ]]; then
            release_args+=( --prerelease )
          fi
          guard="echo"
          [ "$DO_PUBLISH" = "false" ] || guard=""
          src/script/label-assets dist/maton_* | xargs $guard gh release create "${release_args[@]}" --
      - name: Publish site
        env:
          DO_PUBLISH: ${{ inputs.environment == 'production' && !contains(inputs.tag_name, '-') }}
          TAG_NAME: ${{ inputs.tag_name }}
        working-directory: ./site
        run: |
          if [ "$DO_PUBLISH" = "true" ]; then
            git push
          else
            git log --oneline @{upstream}..
            git diff --name-status @{upstream}..
          fi
